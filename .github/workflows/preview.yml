name: 小程序预览

on:
  push:
    branches: [dev]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: 安装最新版 miniprogram-ci
        run: npm install miniprogram-ci@latest

      - name: Patch sign.js — 正则全局替换 privateEncrypt 为 crypto.sign
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const signJsPath = path.join(process.env.GITHUB_WORKSPACE, 'node_modules/miniprogram-ci/dist/utils/sign.js');
          let content = fs.readFileSync(signJsPath, 'utf8');

          // 在 getSignature 函数体内，替换 privateEncrypt 调用
          // minified sign.js 中的 privateEncrypt 调用特征
          const target = 'crypto_1.default.privateEncrypt({key:r,padding:crypto_1.default.constants.RSA_PKCS1_PADDING},Buffer.from(JSON.stringify(t))).toString("base64")';

          if (!content.includes(target)) {
            console.error('Target code NOT found in sign.js');
            console.error('Looking for:', target.substring(0, 80));
            // 搜索上下文
            const idx = content.indexOf('privateEncrypt');
            if (idx >= 0) {
              console.error('Found privateEncrypt at idx', idx);
              console.error('Context:', content.substring(Math.max(0,idx-50), idx+200));
            }
            process.exit(1);
          }

          const replacement = 'crypto.sign(null, Buffer.from(JSON.stringify(t)), r).toString("base64")';

          content = content.replace(target, replacement);

          fs.writeFileSync(signJsPath, content);
          console.log('sign.js patched: privateEncrypt -> crypto.sign');

          // 验证 patch
          if (content.includes('crypto.sign')) {
            console.log('VERIFIED: crypto.sign is now in sign.js');
          } else {
            console.error('VERIFICATION FAILED');
            process.exit(1);
          }
          "

      - name: 生成预览二维码
        run: node scripts/preview.js
        env:
          APPID: ${{ secrets.WX_MINI_APPID }}
          PRIVATE_KEY: ${{ secrets.WX_MINI_PRIVATE_KEY }}
          PROJECT_PATH: ${{ github.workspace }}

      - name: 上传二维码图片
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: preview-qrcode
          path: preview-qrcode.png
          retention-days: 7
