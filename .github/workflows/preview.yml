name: 小程序预览

on:
  push:
    branches: [dev]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: 安装最新版 miniprogram-ci
        run: npm install miniprogram-ci@latest

      - name: Patch sign.js to use openssl for RSA signature
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');
          const projectPath = process.env.GITHUB_WORKSPACE;
          const signJsPath = path.join(projectPath, 'node_modules/miniprogram-ci/dist/utils/sign.js');
          let content = fs.readFileSync(signJsPath, 'utf8');
          
          // Find and replace the getSignature function
          const oldFn = content.match(/async function getSignature\([^)]+\)\s*\{[^}]+try\s*\{[^}]+crypto_1\.default\.privateEncrypt[^}]+\}\s*catch[^}]+\}/s);
          if (oldFn) {
            const patchedFn = \`async function getSignature(r, e) {
  const t = { appid: e, rand_str: await getRandomString(e) };
  const dataStr = JSON.stringify(t);
  const keyPath = require('path').join(projectPath, 'private.key');
  try {
    const sig = execSync('echo \'' + Buffer.from(dataStr).toString('base64') + '\'' + ' | base64 -d | openssl rsautl -sign -inkey ' + keyPath + ' -keyform PEM -rsapadding | openssl base64 -A', { encoding: 'utf8' });
    return sig.trim();
  } catch (err) {
    throw new Error('openssl signature failed: ' + err.message);
  }
}\`;
            content = content.replace(oldFn[0], patchedFn);
            fs.writeFileSync(signJsPath, content);
            console.log('sign.js patched successfully');
          } else {
            console.log('Could not find getSignature function to patch');
          }
          " 2>&1
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: 生成预览二维码
        id: preview
        run: node scripts/preview.js
        env:
          APPID: ${{ secrets.WX_MINI_APPID }}
          PRIVATE_KEY: ${{ secrets.WX_MINI_PRIVATE_KEY }}
          PROJECT_PATH: ${{ github.workspace }}

      - name: 上传二维码图片
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: preview-qrcode
          path: preview-qrcode.png
          retention-days: 7
