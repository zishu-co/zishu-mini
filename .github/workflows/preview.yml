name: 小程序预览

on:
  push:
    branches: [preview]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: zishu-mini/package-lock.json

      - name: 安装依赖
        run: |
          cd zishu-mini
          npm ci

      - name: 安装 miniprogram-ci
        run: |
          cd zishu-mini
          npm install miniprogram-ci

      - name: 生成预览二维码
        id: preview
        run: |
          cd zishu-mini
          node scripts/preview.js
        env:
          APPID: ${{ secrets.WX_MINI_APPID }}
          PRIVATE_KEY: ${{ secrets.WX_MINI_PRIVATE_KEY }}
          PROJECT_PATH: ${{ github.workspace }}/zishu-mini

      - name: 上传二维码图片
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: preview-qrcode
          path: zishu-mini/preview-qrcode.png
          retention-days: 7
