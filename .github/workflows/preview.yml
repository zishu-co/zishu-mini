name: 小程序预览

on:
  push:
    branches: [dev]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装依赖
        run: npm ci

      - name: 安装最新版 miniprogram-ci
        run: npm install miniprogram-ci@latest

      - name: 生成预览二维码
        run: node scripts/preview.js
        env:
          APPID: ${{ secrets.WX_MINI_APPID }}
          PRIVATE_KEY: ${{ secrets.WX_MINI_PRIVATE_KEY }}
          APP_SECRET: ${{ secrets.WX_MINI_APP_SECRET }}
          PROJECT_PATH: ${{ github.workspace }}

      - name: 上传所有诊断文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-artifacts
          path: |
            preview-qrcode.png
            preview.log
            api-response.json
            preview-url.txt
          retention-days: 7
