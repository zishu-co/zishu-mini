name: 小程序预览

on:
  push:
    branches: [dev]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: 安装最新版 miniprogram-ci
        run: npm install miniprogram-ci@latest

      - name: Patch sign.js — 修复 OpenSSL 3.0 KeyObject 兼容性问题
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const projectPath = process.env.GITHUB_WORKSPACE;
          const signJsPath = path.join(projectPath, 'node_modules/miniprogram-ci/dist/utils/sign.js');
          let content = fs.readFileSync(signJsPath, 'utf8');

          // 找到 getSignature 函数，替换 crypto.privateEncrypt 调用
          // 关键修改：将 key 字符串转为 KeyObject
          const oldCode = \`return crypto_1.default.privateEncrypt({key:r,padding:crypto_1.default.constants.RSA_PKCS1_PADDING},Buffer.from(JSON.stringify(t))).toString(\"base64\")\`;

          const newCode = \`const keyObj = typeof r === 'string' ? crypto.createPrivateKey(r) : r; return crypto_1.default.privateEncrypt({key: keyObj, padding: crypto_1.default.constants.RSA_PKCS1_PADDING}, Buffer.from(JSON.stringify(t))).toString(\"base64\")\`;

          if (content.includes(oldCode) && !content.includes('createPrivateKey')) {
            content = content.replace(oldCode, newCode);
            fs.writeFileSync(signJsPath, content);
            console.log('✅ sign.js patched — crypto.createPrivateKey applied');
          } else if (content.includes('createPrivateKey')) {
            console.log('✅ sign.js already patched');
          } else {
            console.log('⚠️  could not find target code to patch, trying regex replacement');
            // fallback: 通用正则替换
            content = content.replace(
              /return crypto_1\.default\.privateEncrypt\(\{key:r,padding:crypto_1\.default\.constants\.RSA_PKCS1_PADDING\},Buffer\.from\(JSON\.stringify\(t\)\)\)\.toString\("base64"\)/g,
              'const keyObj = typeof r === '"'"'string'"'"' ? crypto.createPrivateKey(r) : r; return crypto_1.default.privateEncrypt({key: keyObj, padding: crypto_1.default.constants.RSA_PKCS1_PADDING}, Buffer.from(JSON.stringify(t))).toString("base64")'
            );
            fs.writeFileSync(signJsPath, content);
            console.log('✅ sign.js patched with regex fallback');
          }
          "

      - name: 生成预览二维码
        run: node scripts/preview.js
        env:
          APPID: ${{ secrets.WX_MINI_APPID }}
          PRIVATE_KEY: ${{ secrets.WX_MINI_PRIVATE_KEY }}
          PROJECT_PATH: ${{ github.workspace }}

      - name: 上传二维码图片
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: preview-qrcode
          path: preview-qrcode.png
          retention-days: 7
