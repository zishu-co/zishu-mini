name: 小程序上传

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, dev, momo]
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: |
          npm ci

      - name: 安装 miniprogram-ci
        run: |
          npm install miniprogram-ci

      - name: 编译并上传小程序到微信公众平台
        run: |
          node scripts/upload.js
        env:
          APPID: ${{ secrets.WX_MINI_APPID }}
          PRIVATE_KEY: ${{ secrets.WX_MINI_PRIVATE_KEY }}
          PROJECT_PATH: ${{ github.workspace }}
          UPLOAD_VERSION: "1.4.${{ github.run_number }}"
          UPLOAD_DESC: "momo分支 UI与交互全面升级 (CI #${{ github.run_number }})"
